<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f8fafc" />
    <meta
      name="description"
      content="WattWise AI — household energy intelligence. ML-powered bill forecasting, waste and anomaly detection, and a what-if savings simulator."
    />
    <title>WattWise AI — Household Energy Intelligence</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script>
      // Light mode only
      try {
        document.documentElement.style.colorScheme = 'light'
        // Check if user is authenticated
        const isAuthenticated = localStorage.getItem('wattwise.isAuthenticated') === 'true'
        if (!isAuthenticated && window.location.pathname !== '/login') {
          window.location.href = '/login'
        }
      } catch (_) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
